# Talentrupt Marketing Agent ("Myra") — Nginx site
# Source of truth: deploy/nginx-myra.conf in the app repo. bootstrap.sh installs this (sed-swapping the
# domain/ports for any DOMAIN override). Manual install:
#   cp deploy/nginx-myra.conf /etc/nginx/sites-available/talentrupt-agent
#   ln -s /etc/nginx/sites-available/talentrupt-agent /etc/nginx/sites-enabled/talentrupt-agent
#   certbot certonly --nginx -d myra.htuniverse.com   # its own cert (like avasupport)
#   nginx -t && systemctl reload nginx
#
# ONE upstream behind one host: the FastAPI/uvicorn process on 127.0.0.1:8100 serves BOTH the static
# UI (exported to frontend/out) and the API (REST + SSE + generated files). No separate Node server.

server {
    listen 80;
    listen [::]:80;
    server_name myra.htuniverse.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name myra.htuniverse.com;

    ssl_certificate     /etc/letsencrypt/live/myra.htuniverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myra.htuniverse.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # Generated decks/PDFs and employee-photo uploads can be several MB.
    client_max_body_size 25m;

    # --- API + SSE streaming + generated files (uvicorn :8100) ---
    # Streams (chat/create/campaign) need buffering OFF so tokens/assets arrive as produced.
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events: chat / create / campaign stream tokens + assets as they're produced.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection "";
        proxy_read_timeout 600s;   # image generation can take a while
        proxy_send_timeout 600s;
    }

    # --- Everything else: the static UI, served by the SAME uvicorn process ---
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
