# Talentrupt Marketing Agent ("Myra") — Nginx site
# Source of truth: deploy/nginx-myra.conf in the app repo. bootstrap.sh installs this (sed-swapping the
# domain/ports for any DOMAIN override). Manual install:
#   cp deploy/nginx-myra.conf /etc/nginx/sites-available/talentrupt-agent
#   ln -s /etc/nginx/sites-available/talentrupt-agent /etc/nginx/sites-enabled/talentrupt-agent
#   certbot certonly --nginx -d myra.htuniverse.com   # its own cert (like avasupport)
#   nginx -t && systemctl reload nginx
#
# Two upstreams behind one host:
#   - Next.js web (next start)  -> 127.0.0.1:4600   serves the UI
#   - FastAPI api (uvicorn)     -> 127.0.0.1:8100   serves /api/* (REST + SSE + generated files)

server {
    listen 80;
    listen [::]:80;
    server_name myra.htuniverse.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name myra.htuniverse.com;

    ssl_certificate     /etc/letsencrypt/live/myra.htuniverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myra.htuniverse.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    # Generated decks/PDFs and employee-photo uploads can be several MB.
    client_max_body_size 25m;

    # --- API + SSE streaming + generated files (uvicorn :8100) ---
    # The frontend is built with NEXT_PUBLIC_API_BASE=https://myra.htuniverse.com, so every API call,
    # every /api/files/... asset URL, and every stream hits /api/ here.
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events: chat / create / campaign stream tokens + assets as they're produced.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection "";
        proxy_read_timeout 600s;   # image generation can take a while
        proxy_send_timeout 600s;
    }

    # --- Next.js app (next start :4600) ---
    location / {
        proxy_pass http://127.0.0.1:4600;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
