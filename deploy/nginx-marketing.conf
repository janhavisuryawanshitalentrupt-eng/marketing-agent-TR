# Talentrupt Marketing Agent — Nginx site
# Source of truth: deploy/nginx-marketing.conf in the app repo.
# Install on the droplet:
#   cp deploy/nginx-marketing.conf /etc/nginx/sites-available/marketing
#   ln -s /etc/nginx/sites-available/marketing /etc/nginx/sites-enabled/marketing
#   certbot certonly --nginx -d marketing.htuniverse.com   # its own cert (like avasupport)
#   nginx -t && systemctl reload nginx
#
# This app is TWO upstreams behind one host:
#   - Next.js web (next start)  -> 127.0.0.1:4600   serves the UI
#   - FastAPI api (uvicorn)     -> 127.0.0.1:8100   serves /api/* (REST + SSE + generated files)

server {
    listen 80;
    listen [::]:80;
    server_name marketing.htuniverse.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name marketing.htuniverse.com;

    ssl_certificate     /etc/letsencrypt/live/marketing.htuniverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketing.htuniverse.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Generated decks/PDFs and employee-photo uploads can be several MB.
    client_max_body_size 25m;

    # --- API + SSE streaming + generated files (uvicorn :8100) ---
    # The frontend is built with NEXT_PUBLIC_API_BASE=https://marketing.htuniverse.com, so every API
    # call, every /api/files/... asset URL, and every stream hits /api/ here.
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events: chat / create / campaign stream tokens + assets as they're produced.
        # Buffering MUST be off or the UI would only update when the whole response finishes.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection "";
        proxy_read_timeout 600s;   # image generation can take a while
        proxy_send_timeout 600s;
    }

    # --- Next.js app (next start :4600) ---
    location / {
        proxy_pass http://127.0.0.1:4600;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
